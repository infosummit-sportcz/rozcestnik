<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Montserrat:wght@400;500&display=swap">
<style>
  /* Layout: one centered column on brand black; logo, a short tyrkys rule, then a hairline-separated list of links.
     Brand manual: black / white / tyrkys, Futura primary (Jost as web stand-in), Montserrat secondary, wide-tracked capitals. */
  :root {
    color-scheme: dark;
    --black: #000000;
    --white: #ffffff;
    --teal: #75cbc9;
    --teal-deep: #00a8ad;
    --line: #262b2b;
    --muted: #9aa5a5;
    --hover: #0b1717;
    --display: "Futura", "Futura PT", "Jost", "Century Gothic", "Montserrat", sans-serif;
    --body: "Montserrat", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--black);
    color: var(--white);
    font-family: var(--body);
    padding-block: 64px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 0; }
  footer { margin-top: 44px; }
  header { display: flex; flex-direction: column; align-items: stretch; gap: 22px; }
  .brand { margin: 0; padding-left: 12px; }
  .claim { margin: 0; padding-left: 12px; font-family: var(--display); font-size: 13px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: var(--teal); line-height: 1.5; }
  .brand img { width: min(250px, 68vw); height: auto; display: block; }
  .rule { width: 100%; height: 2px; background: var(--teal); margin-top: 6px; }
  nav { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 20px;
    padding: 22px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--white); text-decoration: none;
    transition: background-color .2s ease;
  }
  .row:hover { background: var(--hover); }
  .row:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  .icon { width: 30px; height: 30px; flex: none; fill: none; stroke: var(--teal); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .name { font-family: var(--display); font-size: 16px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; line-height: 1.3; }
  .sub { font-size: 12.5px; color: var(--muted); letter-spacing: 0.02em; line-height: 1.35; }
  .arrow { width: 28px; height: 12px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s ease, stroke .2s ease; }
  .row:hover .arrow { stroke: var(--teal); transform: translateX(5px); }
  footer { text-align: center; font-family: var(--display); font-size: 11px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 380px) { .name { font-size: 14.5px; letter-spacing: 0.14em; } .row { gap: 16px; } }
  @media (prefers-reduced-motion: reduce) { .row, .arrow { transition: none; } }
</style>
